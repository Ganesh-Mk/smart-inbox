# Smart Inbox — Spring Boot configuration.
#
# Every value that differs between a laptop and a reviewer's machine comes from the
# environment (repo-root .env, loaded by docker compose or exported by the shell). Nothing
# secret has a default here (CLAUDE.md constraint 3).

spring:
  application:
    name: smart-inbox

  datasource:
    url: jdbc:oracle:thin:@//${ORACLE_HOST:localhost}:${ORACLE_PORT:1521}/${ORACLE_SERVICE:FREEPDB1}
    username: ${ORACLE_APP_USER:SMARTINBOX}
    password: ${ORACLE_APP_PASSWORD}
    driver-class-name: oracle.jdbc.OracleDriver
    hikari:
      # Four workers plus the poller plus the API, with headroom. Oracle Free is a 2 GB
      # container: a large pool would buy nothing and cost memory.
      maximum-pool-size: 12
      minimum-idle: 2
      connection-timeout: 20000
      pool-name: smart-inbox-pool

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true

  jpa:
    # The schema is owned by Flyway, never by Hibernate (CLAUDE.md conventions).
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.OracleDialect
        jdbc:
          batch_size: 50
          time_zone: UTC
        format_sql: false

  servlet:
    multipart:
      # Literature batch upload (bonus): several article PDFs at once.
      max-file-size: ${MAX_ATTACHMENT_MB:25}MB
      max-request-size: 200MB

  # NOTE: there is deliberately no `spring.mail` block. We never use Spring's JavaMailSender —
  # ImapMailboxAdapter builds its own jakarta.mail Session from `inbox.mail.*` below. Setting
  # spring.mail.host would auto-configure a JavaMailSender and, with it, a health indicator that
  # probes the port as SMTP. Pointed at our IMAP port it reports the whole application DOWN with
  # "bad greeting from SMTP host ... * OK IMAP4rev1 Server". MailboxHealthIndicator checks the
  # connection we actually depend on instead.

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: always

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    root: INFO
    com.clinevo.inbox: DEBUG
    org.flywaydb: INFO

# ---------------------------------------------------------------------------------------
# Application settings. Mirrors PROJECT_PLAN §8 and the limits in .env.example.
# ---------------------------------------------------------------------------------------
inbox:
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:3143}
    user: ${MAIL_USER:safety@smart-inbox.test}
    password: ${MAIL_PASSWORD:}
    ssl: ${MAIL_SSL:false}
    folder: ${MAIL_FOLDER:INBOX}
    poll-interval-ms: 10000
    poll-enabled: true
    # E5: recurse exactly one level into a message/rfc822 forward; deeper is logged and skipped.
    max-nesting-level: 1

  limits:
    max-attachment-mb: ${MAX_ATTACHMENT_MB:25}
    max-pdf-pages: ${MAX_PDF_PAGES:60}

  queue:
    worker-threads: ${WORKER_THREADS:4}
    batch-size: 2
    poll-interval-ms: 1000
    # E37: a job locked longer than this is presumed abandoned and returned to PENDING.
    lease-seconds: 300
    reap-interval-ms: 60000
    max-attempts: 3

  ai:
    base-url: ${AI_SERVICE_URL:http://localhost:8000}
    timeout-seconds: 300

  storage:
    blob-dir: ${BLOB_DIR:./data/blobs}
    render-dir: ${RENDER_DIR:./data/renders}

  security:
    reviewer-user: ${REVIEWER_USER:reviewer}
    reviewer-password: ${REVIEWER_PASSWORD:reviewer}
    admin-user: ${ADMIN_USER:admin}
    admin-password: ${ADMIN_PASSWORD:admin}
